name: Publish deploy artifact

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        env:
          # prisma.config.ts resolves DATABASE_URL eagerly, and `prisma generate`
          # (run via postinstall) loads that config even though it never
          # connects to a database. A placeholder satisfies the check.
          DATABASE_URL: 'mysql://user:password@localhost:3306/placeholder'
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the build output outside the repo so it survives the branch switch.
          mv dist /tmp/dist

          git checkout --orphan deploy-tmp
          git reset --hard

          git checkout main -- package.json package-lock.json prisma.config.ts prisma

          mv /tmp/dist dist

          git add -f dist package.json package-lock.json prisma.config.ts prisma
          git commit -m "Deploy ${{ github.sha }}"

          git branch -D deploy 2>/dev/null || true
          git branch -m deploy
          git push origin deploy --force

      # Optional: uncomment if your Hostinger plan exposes a deploy webhook URL.
      # Add the URL as a repo secret named HOSTINGER_DEPLOY_WEBHOOK first.
      # - name: Trigger Hostinger pull
      #   if: ${{ env.HOSTINGER_DEPLOY_WEBHOOK != '' }}
      #   env:
      #     HOSTINGER_DEPLOY_WEBHOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
      #   run: curl -fsSL -X POST "$HOSTINGER_DEPLOY_WEBHOOK"
